[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "id-and-passport-ocr"
version = "1.0.0"
description = "Extract structured data from passports and ID cards using OCR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Chi Kingsley" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = ["passport", "id-card", "OCR", "gemini", "extraction", "rapidocr", "mrz"]

dependencies = [
    "pillow>=11.0.0",
    "pdfminer.six>=20240706",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0", "python-dotenv>=1.0.0"]
rapidocr = ["rapidocr-onnxruntime>=1.4.0"]
all = ["google-genai>=1.0.0", "python-dotenv>=1.0.0", "rapidocr-onnxruntime>=1.4.0"]

[tool.hatch.build.targets.sdist]
include = ["/id_and_passport_ocr"]

[tool.hatch.build.targets.wheel]
packages = ["id_and_passport_ocr"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["id_and_passport_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.7",
    "ty>=0.0.1a30",
]
